# Quantumult X 片段：把 DeepSeek 官方 API 转发到中转站
# 注意：这个文件是给「手动并入配置」用的，不要当「重写资源」添加
# （重写资源里不能有 [rewrite_local] 段，会提示 invalid line rewrite_local）
# 要加资源请用 rewrite.conf / rewrite-cdn.conf
# 把 [rewrite_local] 那一行并入自己的配置，hostname 并入已有的 [mitm] 行。

[rewrite_local]
# 国内拉不到 raw.githubusercontent.com 时，改用下面注释里的 jsDelivr 镜像，两条只留一条
^https:\/\/api\.deepseek\.com url script-request-header https://raw.githubusercontent.com/lejw0925/qx-deepseek-api-forward/main/deepseek-forward.js
# ^https:\/\/api\.deepseek\.com url script-request-header https://fastly.jsdelivr.net/gh/lejw0925/qx-deepseek-api-forward@main/deepseek-forward.js

[mitm]
hostname = api.deepseek.com
