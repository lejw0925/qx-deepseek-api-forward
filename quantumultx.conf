# Quantumult X 片段：DeepSeek -> 中转站（307 + 补回 Authorization）
# 说明与前提：https://github.com/lejw0925/qx-deepseek-api-forward
#
# 1. 把 auth-inject.example.js 复制一份、填上 Key，放到私有地址
# 2. 把下面第二条规则里的脚本地址换成你自己的
# 3. 两段分别并入已有的 [rewrite_local] / [mitm]，不要新建同名段

[rewrite_local]
^https:\/\/api\.deepseek\.com\/(.*)$ url 307 https://api.lmr-leavingnow.cn.mt/$1
^https:\/\/api\.lmr-leavingnow\.cn\.mt\/.* url script-request-header https://你的私有地址/auth-inject.js

[mitm]
hostname = api.deepseek.com, api.lmr-leavingnow.cn.mt
