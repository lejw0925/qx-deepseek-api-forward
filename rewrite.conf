; DeepSeek API 转发 · Quantumult X 重写资源
; 把 api.deepseek.com 的请求在隧道内改写到中转站，Authorization 原样保留
; 说明：https://github.com/lejw0925/qx-deepseek-api-forward
;
; 资源文件里不能写 [rewrite_local] / [mitm] 段头，hostname 直接裸写一行

hostname = api.deepseek.com

^https:\/\/api\.deepseek\.com url script-request-header https://raw.githubusercontent.com/lejw0925/qx-deepseek-api-forward/main/deepseek-forward.js
